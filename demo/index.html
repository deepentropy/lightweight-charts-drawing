<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>lightweight-charts-drawing demo</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0f0f0f; color: #dbdbdb; font-family: -apple-system, BlinkMacSystemFont, "Trebuchet MS", Roboto, Ubuntu, sans-serif; font-size: 13px; }
    #bar { display: flex; gap: 8px; align-items: center; padding: 6px 8px; border-bottom: 1px solid #2e2e2e; }
    #chart { position: absolute; top: 40px; left: 0; right: 320px; bottom: 0; }
    #log { white-space: pre-wrap; position: absolute; top: 40px; right: 0; width: 320px; bottom: 0; overflow: auto; font: 11px monospace; padding: 4px; box-sizing: border-box; border-left: 1px solid #2e2e2e; }
    select, button { background: #1e1e1e; color: #dbdbdb; border: 1px solid #3a3a3a; padding: 3px 6px; }
  </style>
</head>
<body>
  <div id="bar">
    <select id="tool"><option value="">Cursor</option></select>
    <select id="magnet"><option>off</option><option>weak</option><option>strong</option></select>
    <label><input type="checkbox" id="stay" /> Keep drawing</label>
    <button id="export">Export</button>
    <button id="import">Import</button>
    <button id="clear">Clear</button>
    <button id="image">Image…</button>
    <button id="anchor" disabled>Anchor drawing</button>
    <input type="file" id="imageFile" accept="image/png,image/jpeg,image/webp" hidden />
    <span id="count"></span>
  </div>
  <div id="chart"></div>
  <div id="log"></div>
  <script type="module" src="./demo.ts"></script>
</body>
</html>

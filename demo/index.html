<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>lightweight-charts-drawing: TradingView-style drawing tools for lightweight-charts</title>
  <link rel="stylesheet" href="./demo.css" />
</head>
<body>
  <header id="top">
    <div class="brand">
      <span class="name">lightweight-charts-drawing</span>
      <span id="version" class="badge"></span>
    </div>
    <div class="symbol"><b>SPY</b><span>SPDR S&amp;P 500 ETF</span><span class="tf">1D</span></div>
    <div class="spacer"></div>
    <button id="export" class="btn" title="Download the drawings as a JSON file"></button>
    <button id="import" class="btn" title="Load drawings from a JSON file"></button>
    <input type="file" id="importFile" accept="application/json,.json" hidden />
    <a class="btn link" href="https://github.com/deepentropy/lightweight-charts-drawing/blob/main/docs/TOOLS.md" target="_blank" rel="noopener">Tools</a>
    <a class="btn link" href="https://www.npmjs.com/package/lightweight-charts-drawing" target="_blank" rel="noopener">npm</a>
    <a id="github" class="btn link icon" href="https://github.com/deepentropy/lightweight-charts-drawing" target="_blank" rel="noopener" title="GitHub"></a>
  </header>
  <div id="main">
    <nav id="rail" aria-label="Drawing tools"></nav>
    <div id="chartWrap">
      <div id="chart"></div>
      <div id="selbar" hidden></div>
      <textarea id="editor" hidden spellcheck="false"></textarea>
    </div>
    <div id="flyout" role="menu" hidden></div>
  </div>
  <footer id="status">
    <span id="hint"></span>
    <span class="spacer"></span>
    <span id="count"></span>
  </footer>
  <input type="file" id="imageFile" accept="image/png,image/jpeg,image/webp" hidden />
  <script type="module" src="./demo.ts"></script>
</body>
</html>
